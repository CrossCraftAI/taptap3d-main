name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One run per branch. Cancel superseded runs on branches, but never on main —
# a cancelled main run leaves the branch with no verdict at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A REAL POSTGRES, because the database-backed tests are meant to fail
    # without one rather than skip. The predecessor's suites self-skipped when
    # Postgres was unreachable and quietly dropped ~121 tests while the headline
    # stayed green; a service container is what makes "no skips" affordable.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taptap3d
          POSTGRES_PASSWORD: taptap3d
          POSTGRES_DB: taptap3d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taptap3d -d taptap3d"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://taptap3d:taptap3d@localhost:5432/taptap3d

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Migrate before anything reads the schema. Ordered first so that a broken
      # migration fails here, where the message says so, rather than inside a
      # test where it reads as a broken test.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      # Lint is a separate step and not folded into the build. The predecessor
      # shipped a CI failure from unused imports after running tsc and the tests
      # but not the linter.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── THE BROWSER SUITE ──────────────────────────────────────────────────────
  #
  # 123 tests across chromium and webkit, driving the BUILT application against
  # a real Postgres. Until now they ran only when a person remembered, which
  # for a suite that has caught every defect the unit tests structurally cannot
  # — a GET that advanced a sale's stage, a panel covering the plates it
  # treats, a rail that ate the document it navigates — is the wrong place to
  # keep them.
  #
  # ── IT DOES NOT GATE THE DEPLOY, YET, AND THAT IS DELIBERATE ───────────────
  #
  # `deploy` needs `verify` and not this. An eight-minute browser suite that
  # has never run on this runner will have environment failures that are not
  # product failures, and a deploy blocked by one of those on the day
  # something needs shipping is how a gate gets removed permanently.
  #
  # It still shows a red X on the commit, which is what makes it a check
  # rather than a cron job nobody reads.
  #
  # PROMOTE IT by adding `browser` to `deploy.needs` once it has run green on
  # main for a couple of weeks. That is the whole change.
  browser:
    runs-on: ubuntu-latest

    # ── ONE ENGINE PER JOB, WHICH IS A CORRECTION ─────────────────────────
    #
    # The first version ran both in one job with a 30-minute budget, measured
    # from 11 minutes on a developer laptop. It was killed at exactly 30:00 on
    # its first run: a two-core hosted runner is not a laptop, and assuming
    # otherwise is the kind of estimate that reads as a hang.
    #
    # Split, each job runs half the tests and the two run at once, so the
    # wall-clock is one engine plus one build rather than two of each. The
    # build is duplicated; it is the cheaper half and it buys a failure that
    # names its engine in the job title rather than in a log.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]

    name: browser (${{ matrix.project }})
    # Room for a slow runner, because a timeout that trips is indistinguishable
    # from a hang in the product — which is exactly how the first one read.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taptap3d
          POSTGRES_PASSWORD: taptap3d
          POSTGRES_DB: taptap3d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taptap3d -d taptap3d"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://taptap3d:taptap3d@localhost:5432/taptap3d

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      # ── THE FONTS, AND THEIR ABSENCE IS SILENT ────────────────────────────
      #
      # The PDF route paints 青 on a canvas and compares it to a notdef box
      # (src/lib/render/pdf.ts), so a runner with no CJK face does not fail
      # loudly — it exports a catalogue of empty boxes and reports TOFU. The
      # Dockerfile installs the Alpine equivalents and says the same thing
      # there: font-noto-cjk alone is SANS, and the extra package is what
      # carries the serif this product sets catalogues in.
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra
          fc-cache -f
          fc-list : family | grep -i "noto serif cjk" | head -3 || echo "NO CJK SERIF FOUND"

      # `--with-deps` pulls the shared libraries webkit needs, which are not on
      # a bare runner and whose absence shows up as a browser that will not
      # launch rather than as a missing package.
      - name: Install browsers
        # Only the engine this job runs, plus chromium always: the PDF route
        # uses puppeteer and is pointed at it below.
        run: npx playwright install --with-deps chromium ${{ matrix.project }}

      # THE PDF ROUTE USES PUPPETEER AND NEEDS ITS OWN CHROMIUM. Rather than a
      # second browser download, it is pointed at the one Playwright just
      # installed — which is what .env.example tells a developer to do, so CI
      # and a laptop are doing the same thing.
      - name: Run the browser suite
        run: |
          PUPPETEER_EXECUTABLE_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"             npx playwright test --project=${{ matrix.project }}

      # The report names which test failed and at what width; the trace is how
      # somebody finds out why without reproducing it. Kept only on failure —
      # a green run's artifacts are megabytes nobody opens.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    # NEEDS: verify. That dependency is the whole point of putting deploy in this
    # workflow rather than in its own — a deploy that can outrun the tests is a
    # deploy that ships red.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One deploy at a time, and never cancel one in flight: interrupting flyctl
    # partway through a release can leave the app on a half-applied version.
    concurrency:
      group: deploy-fly
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # THE SKIP IS INSIDE THE STEP, not on the job. `secrets` is not available
      # in a job-level `if` — GitHub rejects the whole workflow file, which fails
      # every run in 0s with "workflow file issue" and no log, and looks nothing
      # like the expression mistake it is. Checking the value in the shell is
      # what actually works.
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set — the Fly app is not provisioned yet."
            echo "Skipping deploy. See ROADMAP.md M1."
            exit 0
          fi
          flyctl deploy --remote-only --wait-timeout 600
