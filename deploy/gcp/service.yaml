apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: taptap3d
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cloudsql-instances: PROJECT_ID:asia-east2:SQL_INSTANCE
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '3'
    spec:
      serviceAccountName: taptap3d-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 2
      timeoutSeconds: 300
      containers:
        - image: asia-east2-docker.pkg.dev/PROJECT_ID/taptap3d/app:COMMIT_SHA
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: TAPTAP3D_REQUIRE_AUTH
              value: 'true'
            - name: TAPTAP3D_GCS_BUCKET
              value: PRIVATE_BUCKET_NAME
            - name: TAPTAP3D_PUBLIC_ORIGIN
              value: https://PUBLIC_HOSTNAME
            - name: TAPTAP3D_RUN_MIGRATIONS
              value: 'false'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taptap3d-database-url
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: taptap3d-google-client-id
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taptap3d-google-client-secret
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
