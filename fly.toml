# PROVISIONED. https://taptap3d.fly.dev, deployed from `main` on green by the
# deploy job in .github/workflows/ci.yml, which holds a Fly deploy token scoped
# to this app alone (repository secret FLY_API_TOKEN).
#
# This app REPLACED the predecessor's deployment. `tap3d` still exists in the
# same organisation, but its public addresses have been released, so nothing
# routes to it; its machine, its 3GB `tap3d_data` volume and its database are
# untouched, because the specialist's UAT edits live on that volume and the
# predecessor is meant to stay readable (README, "Relationship to tap3d").
# Retiring it for good is `fly apps destroy tap3d`, and that is deliberately not
# automated.
#
# THE DATABASE IS THE PREDECESSOR'S CLUSTER, NOT A NEW ONE. Managed Postgres
# `tap3d-db` (dzx6qo65m8p0jpv5, sin) already existed and sat idle at ~10GB; this
# app was given its own database and role on it (`taptap3d`/`taptap3d`) rather
# than a second cluster, which would have doubled the standing bill for a
# pre-revenue demo. The two databases share a server and nothing else. Splitting
# them is `fly mpg create` plus a new DATABASE_URL, and nothing in the app
# assumes co-tenancy.

app = "taptap3d"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero is deliberate for a pre-revenue app: the first request after an idle
  # period pays a cold start, and nobody is watching a demo at 4am.
  min_machines_running = 0

  [[http_service.checks]]
    # /api/health is exempt from the access gate on purpose (src/middleware.ts):
    # a check that cannot authenticate concludes a working container is down and
    # restarts it forever. This one also reports whether Postgres is reachable,
    # which a TCP probe cannot.
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
